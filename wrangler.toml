#RankLock frontend — Cloudflare Workers Static Assets ($0 baseline).
#
#`wrangler deploy` uploads the prebuilt ./dist as static assets. There is NO
#Worker script (`main` is intentionally absent), and intentionally NO
#kv_namespaces / r2_buckets / d1_databases / durable_objects bindings — those
#are the metered bill-spike surfaces the design forbids (architecture §5,
#requirements §A.1). Cloudflare serves the static build for free with unlimited
#bandwidth and no egress charge.
#
#CI builds with `astro build` on the owner's OWN CI/CD (not Cloudflare's build
#system — requirements §9.2) and then runs `wrangler deploy` to upload dist/.
#See .github/workflows/deploy.yml.
name = "ranklock-frontend"
compatibility_date = "2026-06-19"

[assets]
directory = "./dist"
#Unmatched paths serve the prerendered 404 shell for now. The per-user / per-
#match CSR routes (players/:id, matches/:id) are client-rendered shells that are
#NOT prebuilt per id; serving an arbitrary /players/<id> off a single static
#shell (SPA-style fallback, or a Pages `_redirects` prefix rewrite) is finalized
#in C5/C10. Keeping "404-page" here avoids silently mis-serving the home shell
#for deep links before that wiring lands.
not_found_handling = "404-page"
