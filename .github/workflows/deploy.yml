name: Build & Deploy (Cloudflare static assets)

on:
  push:
    branches: [master]
  workflow_dispatch: {}
  repository_dispatch:
    types: [data_version]
  #Weekly rebake (M6): stats are baked into the static pages at BUILD time, and
  #deploys otherwise happen only on code push / data_version dispatch — without
  #this, a quiet repo means unboundedly stale baked stats. Monday 04:47 UTC,
  #offset from the Rust repos' Monday 05:17 oracle lane.
  schedule:
    - cron: '47 4 * * 1'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      #R19: fail if the committed item catalog (src/data/items-*.json) has drifted
      #from the upstream assets feed — runs the real regen path into a temp dir and
      #diffs. Drift = red (regen + commit to fix); upstream outage = loud warning +
      #skip (see scripts/gen-item-catalog.mjs).
      - name: Item catalog drift check
        run: node scripts/gen-item-catalog.mjs --check
      #M17/R25: the build FAILS if the /items/stats bake returns 0 rows (bake-empty
      #guard in src/lib/buildData.ts) — a cold backend must not silently ship ~229
      #empty prerendered item pages. Escape hatch for an intentional empty-stats
      #build: add ALLOW_EMPTY_STATS_BUILD: '1' below.
      - run: npm run build
        env:
          PUBLIC_ADSENSE_CLIENT: ${{ secrets.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
          PUBLIC_DONATION_ADDRESS: ${{ secrets.PUBLIC_DONATION_ADDRESS }}
          PUBLIC_MATOMO_SITE_ID: ${{ secrets.PUBLIC_MATOMO_SITE_ID }}
          PUBLIC_MATOMO_URL: ${{ secrets.PUBLIC_MATOMO_URL }}
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
      - name: Probe deployed site (gate for the purge)
        run: |
          #A broken deploy must not evict the last-good edge copies, so the purge
          #below only runs after the NEW deploy provably serves. Probes hit the
          #worker's own workers.dev hostname: the zone apex (ranklock.app) sits
          #behind a Cloudflare managed challenge that 403s every non-browser
          #client (cf-mitigated: challenge, any UA — verified 2026-07-10), so an
          #unauthenticated probe there can never pass, while workers.dev serves
          #the exact version this run just deployed, outside the zone WAF. The
          #unique query param is cache-busting insurance; /items/ keeps its
          #trailing slash (the assets router 307s /items -> /items/).
          bust="probe=${{ github.run_id }}-${{ github.run_attempt }}"
          for path in / /items/; do
            url="https://ranklock-frontend.shaddar45.workers.dev${path}?${bust}"
            code=$(curl -sS -o /tmp/probe-body -w '%{http_code}' --max-time 30 \
              --retry 5 --retry-delay 4 --retry-all-errors "$url") \
              || { echo "PROBE FAIL $url — curl error"; exit 1; }
            [ "$code" = "200" ] || { echo "PROBE FAIL $url — HTTP $code (expected 200)"; exit 1; }
            [ -s /tmp/probe-body ] || { echo "PROBE FAIL $url — empty body"; exit 1; }
            echo "probe OK $url — HTTP 200, $(wc -c < /tmp/probe-body) bytes"
          done
      - name: Purge Cloudflare cache
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
