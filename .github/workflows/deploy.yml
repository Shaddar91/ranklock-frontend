name: Build & Deploy (Cloudflare static assets)

on:
  push:
    branches: [master]
  workflow_dispatch: {}
  repository_dispatch:
    types: [data_version]
  #Stats are baked into the pages at build time, so without a weekly rebuild a quiet repo keeps serving unboundedly stale stats.
  schedule:
    - cron: '47 4 * * 1'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - name: Item catalog drift check
        run: node scripts/gen-item-catalog.mjs --check
      #The bake-empty guard fails this build when the /items/stats bake returns 0 rows; escape hatch for an intentional empty-stats build is ALLOW_EMPTY_STATS_BUILD: '1' in the env below.
      - run: npm run build
        env:
          PUBLIC_ADSENSE_CLIENT: ${{ secrets.PUBLIC_ADSENSE_CLIENT }}
          PUBLIC_ADSENSE_SLOT_BANNER: ${{ secrets.PUBLIC_ADSENSE_SLOT_BANNER }}
          PUBLIC_ADSENSE_SLOT_RECT: ${{ secrets.PUBLIC_ADSENSE_SLOT_RECT }}
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
          PUBLIC_ASSETS_BASE: ${{ secrets.PUBLIC_ASSETS_BASE }}
          PUBLIC_DONATION_ADDRESS: ${{ secrets.PUBLIC_DONATION_ADDRESS }}
          PUBLIC_MATOMO_SITE_ID: ${{ secrets.PUBLIC_MATOMO_SITE_ID }}
          PUBLIC_MATOMO_URL: ${{ secrets.PUBLIC_MATOMO_URL }}
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
      - name: Probe deployed site (gate for the purge)
        env:
          PROBE_BASE_URL: ${{ secrets.PROBE_BASE_URL }}
        run: |
          #PROBE_BASE_URL is the worker origin, which bypasses the zone WAF; the zone apex 403s every non-browser client, so a probe there could never pass.
          [ -n "$PROBE_BASE_URL" ] || { echo "PROBE FAIL — PROBE_BASE_URL secret unset"; exit 1; }
          bust="probe=${{ github.run_id }}-${{ github.run_attempt }}"
          for path in / /items/; do
            url="${PROBE_BASE_URL}${path}?${bust}"
            code=$(curl -sS -o /tmp/probe-body -w '%{http_code}' --max-time 30 \
              --retry 5 --retry-delay 4 --retry-all-errors "$url") \
              || { echo "PROBE FAIL $url — curl error"; exit 1; }
            [ "$code" = "200" ] || { echo "PROBE FAIL $url — HTTP $code (expected 200)"; exit 1; }
            [ -s /tmp/probe-body ] || { echo "PROBE FAIL $url — empty body"; exit 1; }
            echo "probe OK $url — HTTP 200, $(wc -c < /tmp/probe-body) bytes"
          done
      - name: Purge Cloudflare cache
        run: |
          curl --fail --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
